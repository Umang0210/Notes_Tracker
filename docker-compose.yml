version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: notes_tracker_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - notes-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: notes_tracker_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/notes-tracker
      - JWT_SECRET=production_docker_secret_key_987654321
      - JWT_EXPIRES_IN=7d
      - FRONTEND_URL=http://localhost
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=100
      - MAX_FILE_SIZE=5242880
    depends_on:
      - mongodb
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - notes-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: notes_tracker_client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - notes-network

volumes:
  mongo-data:
  backend-uploads:

networks:
  notes-network:
    driver: bridge
